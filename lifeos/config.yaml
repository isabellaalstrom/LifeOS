# Home Assistant app (add-on) manifest. LifeOS is a standalone app; it only calls Home Assistant (to-do services) if a reminders list is configured below.
name: LifeOS
version: "0.5.0"
slug: lifeos
# Prebuilt image published by .github/workflows/publish-app-image.yml ({arch} = amd64 | aarch64).
# The tag is `version` above, so bump it for every release. ha/build-local-app.ps1 strips this line for local builds.
image: ghcr.io/isabellaalstrom/lifeos-{arch}
description: Personal life management with weekly sprints, habits and retrospectives
url: https://github.com/isabellaalstrom/LifeOS
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
# Served through the HA sidebar via Ingress. No host port is published.
ingress: true
ingress_port: 8099
panel_icon: mdi:compass-rose
panel_title: LifeOS
# Lets the app call Home Assistant (to-do services) when a reminders list is configured; unused otherwise.
homeassistant_api: true
# /data (SQLite DB, Data Protection keys, backups) is persistent and included in HA backups.
# "cold" stops the app while the backup runs so the SQLite file is consistent.
backup: cold
# Optional settings, entered in the HA UI (never stored in the repository). All are optional and omitted by default,
# so nothing has to be filled in. Leave a field empty to keep that feature off.
options: {}
schema:
  reminders_entity: str?
  openai_api_key: password?
  openai_model: str?
  ntfy_url: str?
  ntfy_topic: str?
  ntfy_token: password?
  push_subject: str?
